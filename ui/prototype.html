<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* @land/tokens (copied from ui/land-tokens.css) */
:root {
  --bg: #ffffff; --sf: #ffffff; --sf2: #fafafa; --wl: #fafafa;
  --hair: rgba(0, 0, 0, 0.08); --bd: #e4e4e4;
  --t1: #141414; --t2: #5a5a5a; --t3: #737373;
  --ac: #141414; --ac2: #141414; --ac2-hover: #333333; --on-ac: #ffffff;
  --acdim: rgba(0, 0, 0, 0.05); --acbd: rgba(0, 0, 0, 0.16);
  --rd: #c0271e; --rddim: rgba(192, 39, 30, 0.07); --rdbd: rgba(192, 39, 30, 0.26);
  --warn: #8a5700; --warndim: rgba(245, 163, 0, 0.13); --warnbd: rgba(138, 87, 0, 0.32);
  --gn: #2e7d46; --gndim: rgba(46, 125, 70, 0.09); --gnbd: rgba(46, 125, 70, 0.28);
  --nudim: rgba(0, 0, 0, 0.05); --overlay: rgba(20, 20, 20, 0.45);
  --scrollbar-thumb: rgba(0, 0, 0, 0.18); --canvas-dot: rgba(0, 0, 0, 0.13);
  --shadow-pop: 0 24px 48px rgba(0, 0, 0, 0.16);
  --viz-1: #2a78d6; --viz-2: #eb6834; --viz-3: #1baf7a; --viz-4: #eda100; --viz-5: #e87ba4; --viz-7: #4a3aa7;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0d0d0d; --sf: #161616; --sf2: #111111; --wl: #111111;
    --hair: rgba(255, 255, 255, 0.09); --bd: rgba(255, 255, 255, 0.16);
    --t1: #f2f2f2; --t2: #a8a8a8; --t3: #858585;
    --ac: #fafafa; --ac2: #fafafa; --ac2-hover: #e0e0e0; --on-ac: #0d0d0d;
    --acdim: rgba(255, 255, 255, 0.08); --acbd: rgba(255, 255, 255, 0.22);
    --rd: #ff6157; --rddim: rgba(255, 97, 87, 0.12); --rdbd: rgba(255, 97, 87, 0.3);
    --warn: #f5b84a; --warndim: rgba(245, 184, 74, 0.14); --warnbd: rgba(245, 184, 74, 0.32);
    --gn: #5bb97e; --gndim: rgba(91, 185, 126, 0.12); --gnbd: rgba(91, 185, 126, 0.3);
    --nudim: rgba(255, 255, 255, 0.08); --overlay: rgba(0, 0, 0, 0.6);
    --scrollbar-thumb: rgba(255, 255, 255, 0.2); --canvas-dot: rgba(255, 255, 255, 0.11);
    --shadow-pop: 0 24px 48px rgba(0, 0, 0, 0.5);
    --viz-1: #3987e5; --viz-2: #d95926; --viz-3: #199e70; --viz-4: #c98500; --viz-5: #d55181; --viz-7: #9085e9;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0d0d0d; --sf: #161616; --sf2: #111111; --wl: #111111;
  --hair: rgba(255, 255, 255, 0.09); --bd: rgba(255, 255, 255, 0.16);
  --t1: #f2f2f2; --t2: #a8a8a8; --t3: #858585;
  --ac: #fafafa; --ac2: #fafafa; --ac2-hover: #e0e0e0; --on-ac: #0d0d0d;
  --acdim: rgba(255, 255, 255, 0.08); --acbd: rgba(255, 255, 255, 0.22);
  --rd: #ff6157; --rddim: rgba(255, 97, 87, 0.12); --rdbd: rgba(255, 97, 87, 0.3);
  --warn: #f5b84a; --warndim: rgba(245, 184, 74, 0.14); --warnbd: rgba(245, 184, 74, 0.32);
  --gn: #5bb97e; --gndim: rgba(91, 185, 126, 0.12); --gnbd: rgba(91, 185, 126, 0.3);
  --nudim: rgba(255, 255, 255, 0.08); --overlay: rgba(0, 0, 0, 0.6);
  --scrollbar-thumb: rgba(255, 255, 255, 0.2); --canvas-dot: rgba(255, 255, 255, 0.11);
  --shadow-pop: 0 24px 48px rgba(0, 0, 0, 0.5);
  --viz-1: #3987e5; --viz-2: #d95926; --viz-3: #199e70; --viz-4: #c98500; --viz-5: #d55181; --viz-7: #9085e9;
  color-scheme: dark;
}

/* base */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.45 Geist,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.m,.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:inherit}
button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
small{font-size:12px;color:var(--t3);font-weight:400}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:4px}

/* shell */
.app{min-height:100dvh}
.side{display:none}
.tile{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--ac);color:var(--on-ac);font-weight:700;font-size:12px;letter-spacing:.02em;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--hair)}
.top h1{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per{position:relative}
.perbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);font-weight:500;white-space:nowrap}
.perbtn .st{color:var(--t3);font-weight:400}
@media (max-width:767px){.perbtn .st{display:none}}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:280px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:30}
.pop button{display:flex;width:100%;align-items:center;gap:10px;padding:10px;border:0;background:none;border-radius:8px;text-align:left}
.pop button:hover{background:var(--acdim)}
.pop button span{flex:1}
.pop p{padding:8px 10px 6px;font-size:12px;color:var(--t3);border-top:1px solid var(--hair);margin-top:4px}
#view{padding:16px 16px 104px;max-width:1280px;outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
.tabs a,.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--t3);font-size:11px;text-decoration:none;min-height:56px}
.tabs svg.i{width:22px;height:22px}
.tabs [aria-current]{color:var(--t1);font-weight:600}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--on-ac);font:600 11px "Geist Mono",monospace}
.tabs .cnt{position:absolute;top:5px;left:calc(50% + 6px)}
.cnt[data-n="0"]{display:none}

@media (min-width:768px){
  .app{display:grid;grid-template-columns:208px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;border-right:1px solid var(--hair);padding:14px 8px 10px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-weight:600}
  .side h2{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:12px 10px 6px}
  .side nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--t2)}
  .side nav a:hover{background:var(--acdim);color:var(--t1)}
  .side nav a[aria-current]{background:var(--acdim);color:var(--t1);font-weight:600}
  .side nav a .cnt{margin-left:auto}
  .side .foot{margin-top:auto;padding:10px 4px 0}
  .tabs,.top .tile{display:none}
  .top{padding:0 24px;height:52px}
  #view{padding:20px 24px 48px}
}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;padding:2px;gap:2px}
.seg button{display:grid;place-items:center;min-width:30px;height:28px;padding:0 8px;border:0;background:none;border-radius:6px;color:var(--t3);font-size:13px}
.seg button[aria-pressed=true]{background:var(--acdim);color:var(--t1);font-weight:600}
.seg svg.i{width:15px;height:15px}
.user{display:flex;align-items:center;gap:10px;padding:12px 6px 4px;margin-top:12px;border-top:1px solid var(--hair)}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acdim);border:1px solid var(--hair);font-size:10.5px;font-weight:600;flex:none}
.user b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.user small{font-size:11.5px}

/* sheet */
.sheetw{position:fixed;inset:0;z-index:40;background:var(--overlay);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--sf);border-radius:18px 18px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 8px}
.sheet h2{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:10px 10px 4px}
.sheet a{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:10px;text-decoration:none;font-size:15px}
.sheet a[aria-current]{background:var(--acdim);font-weight:600}
.sheet .row{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px;border-top:1px solid var(--hair);margin-top:8px}

/* building blocks */
.lede{color:var(--t2);margin:0 0 14px;font-size:13px}
.card{background:var(--sf);border:1px solid var(--hair);border-radius:14px;min-width:0}
.card+.card,.stack>*+*{margin-top:14px}.grid>.card,.grid>.stack{margin-top:0}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 0;min-height:44px;flex-wrap:wrap}
.ch h2{font-size:14px;font-weight:600;flex:1;min-width:0}
.ch h2 small{display:block;margin-top:1px}
.cb{padding:12px 16px 16px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g11{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:1024px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.stat{background:var(--sf);border:1px solid var(--hair);border-radius:14px;padding:13px 14px;min-width:0}
.stat .k{font-size:12px;color:var(--t3)}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap}
.stat .s{font-size:12px;color:var(--t2);line-height:1.35}
@media (min-width:768px){.stat{padding:16px}.stat .v{font-size:26px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--acdim)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}.btn.sm svg.i{width:14px;height:14px}
.btn.pri{background:var(--ac2);color:var(--on-ac);border-color:var(--ac2)}.btn.pri:hover{background:var(--ac2-hover)}
.btn.big{height:48px;font-size:15px;font-weight:600;border-radius:12px}
.btn.dng{color:var(--rd);border-color:var(--rdbd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{border:0;background:none;padding:0;text-align:left;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.lnk:hover .nm,a.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg.i{width:14px;height:14px;color:var(--t3);transition:transform .15s}
.lnk[aria-expanded=true] svg.i{transform:rotate(90deg)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--hair);background:var(--nudim);color:var(--t2)}
.pill svg{width:8px;height:8px;fill:currentColor;flex:none}
.pill.ok{color:var(--gn);background:var(--gndim);border-color:var(--gnbd)}
.pill.risk{color:var(--warn);background:var(--warndim);border-color:var(--warnbd)}
.pill.over{color:var(--rd);background:var(--rddim);border-color:var(--rdbd)}
.bdg{display:inline-block;font:500 10.5px/16px "Geist Mono",monospace;padding:0 5px;border-radius:4px;border:1px solid var(--acbd);color:var(--t2);vertical-align:1px;white-space:nowrap}
.bdg.est{border-style:dashed}
.bdg.inv{background:var(--acdim)}
.code{font:500 12px "Geist Mono",monospace;letter-spacing:-.01em}
.sub{display:block;font-size:12px;color:var(--t3);font-weight:400}
.pos{color:var(--rd)}.neg{color:var(--gn)}.dim{color:var(--t3)}.t2{color:var(--t2)}
.nw{white-space:nowrap}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);text-align:left;padding:10px 12px;white-space:nowrap}
.t td{padding:11px 12px;border-top:1px solid var(--hair);vertical-align:middle}
.t th:first-child,.t td:first-child{padding-left:16px}.t th:last-child,.t td:last-child{padding-right:16px}
.t .n{text-align:right;font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.t th.n{font-family:inherit}
.t tfoot td{font-weight:600;background:var(--sf2)}
.t tr.detail td{background:var(--sf2);padding:14px 16px}
.t.plain td{padding-top:9px;padding-bottom:9px}
@media (max-width:767px){
  .t.cards,.t.cards tbody,.t.cards tfoot{display:block}
  .t.cards thead{display:none}
  .t.cards tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px 18px;padding:14px 16px;border-top:1px solid var(--hair)}
  .t.cards td{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0!important;border:0;text-align:right;min-width:0;background:none!important}
  .t.cards td::before{content:attr(data-l);color:var(--t3);font:400 12px Geist,sans-serif;text-align:left;flex:none}
  .t.cards td.ttl,.t.cards td.full{grid-column:1/-1;display:block;text-align:left}
  .t.cards td.wide{grid-column:1/-1}
  .t.cards td.ttl::before,.t.cards td.full::before{display:none}
  .t.cards td.ttl{margin-bottom:2px}
  .t.cards tr.detail{display:block;background:var(--sf2)}
  .t.cards td.none{display:none}
}
.bar{position:relative;height:6px;border-radius:3px;background:var(--nudim);min-width:90px}
.bar i,.bar u{position:absolute;top:0;bottom:0;background:var(--t1)}
.bar i{left:0;border-radius:3px 0 0 3px}
.bar u{opacity:.35}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t1);border-radius:1px}
.bar.risk i,.bar.risk u{background:var(--warn)}.bar.over i,.bar.over u{background:var(--rd)}
.barc{display:flex;align-items:center;gap:10px}.barc .bar{flex:1}.barc span{font:12px "Geist Mono",monospace;color:var(--t2);min-width:38px;text-align:right}

/* lists */
.ls{list-style:none;margin:0;padding:0}
.ls li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--hair)}
.ls li:first-child{border-top:0}
.ls a.go{display:flex;gap:12px;align-items:flex-start;flex:1;text-decoration:none;min-width:0}
.ls .tx{flex:1;min-width:0}
.ls b{font-weight:600}
.ls .tx small{display:block}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--nudim);color:var(--t2)}
.dot svg.i{width:15px;height:15px}
.dot.risk{background:var(--warndim);color:var(--warn)}.dot.ok{background:var(--gndim);color:var(--gn)}.dot.over{background:var(--rddim);color:var(--rd)}
.split .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline;padding:9px 0}
.split .r+.r{border-top:1px solid var(--hair)}
.split .sb{grid-column:1/-1;height:8px;border-radius:4px;background:var(--nudim);display:flex;overflow:hidden;margin-top:3px}
.sb i{background:var(--t1)}
.sb u{background:repeating-linear-gradient(135deg,var(--t3) 0 2px,transparent 2px 5px)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--t2);padding:10px 0 0}
.lg span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lg i{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.lg i.ln{height:0;width:16px;border-top:2px solid var(--viz-1);border-radius:0}
.lg i.ds{border-top-style:dashed}
.lg i.bg{border-top:1.5px solid var(--t3)}
.chart{width:100%}.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:11px "Geist Mono",monospace;fill:var(--t3)}
.chart text.a{font:500 12px Geist,sans-serif;fill:var(--t1)}
.chart text.v{fill:var(--t1);font-weight:600}

/* explore */
.scroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);white-space:nowrap;flex:none;font-size:13px;color:var(--t2)}
.chip[aria-pressed=true]{background:var(--ac2);border-color:var(--ac2);color:var(--on-ac);font-weight:500}
.chip.f{background:var(--acdim);color:var(--t1)}
.chip svg.i{width:13px;height:13px}
.lab{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:0 0 6px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--t3)}
.crumb button{border:0;background:none;padding:2px 0;color:var(--t2);text-decoration:underline;text-underline-offset:3px}
.crumb b{color:var(--t1);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--t3)}

/* request */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--t2);margin-bottom:10px;padding:4px 0}
.rqh{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;margin-bottom:14px}
.rqh h2{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25;flex:1 1 260px}
.rqh .amt{font-size:24px;font-weight:600;letter-spacing:-.02em}
.rqh .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{border-left:2px solid var(--bd);padding:2px 0 2px 12px;color:var(--t1);margin:0 0 14px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0}
dl.kv dt{color:var(--t3);font-size:13px}dl.kv dd{margin:0;min-width:0}
.ev h3{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin:16px 0 6px}
.ev h3:first-child{margin-top:0}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--hair)}
.rows>div:first-child{border-top:0}
.rows>div span:first-child{color:var(--t2);min-width:0}
.rows>div.tot{font-weight:600}.rows>div.tot span:first-child{color:var(--t1)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--sf2)}
.ba+.ba{margin-top:8px}
.ba small{display:block}.ba .m{font-size:16px;font-weight:600}.ba>div:last-child{text-align:right}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:10px}

   {h:'Cost center',c:c=>`<button class="lnk" data-a="cc" data-v="${c.k}" data-fk="cc-${c.k}" aria-expanded="${S.cc===c.k}">${ic('right')}${ccName(c.k)}</button><span class="sub">${esc(c.n)}</span>`,v:c=>c.k},
   {h:'Budget',n:1,c:c=>M(c.b)},{h:'Actual',n:1,c:c=>M(c.a)},{h:'Reserved',n:1,c:c=>c.r?M(c.r):'<span class="dim">—</span>',v:c=>c.r},
   {h:'Available',n:1,c:c=>{const a=c.b-c.a-c.r;return `<span class="${a<0?'pos':''}">${fmt(a)}</span>`;}},
   {h:'Forecast',n:1,c:c=>M(c.f)},
   {h:'Variance',n:1,k:'wide',c:c=>{const v=c.f-c.b;return `<span class="${v>0?'pos':'neg'}">${sg(v)} · ${pc(v/c.b*100)}</span>`;}},
   {h:'State',c:c=>pill(c.s,STAT[c.s])}];
  const after=(c,n)=>S.cc!==c.k?'':`<tr class="detail"><td colspan="${n}" class="full"><div class="dgrid">
    <div><h3>Owner and source</h3><div><b>${esc(c.o)}</b></div><small>Budget v3 · ${esc(c.src)}${c.src==='Datarails'?' · synced 2 Nov 2026':''}</small></div>
    <div><h3>Months</h3><div class="rows">${[['September',c.h[0],c.h[1]],['October · locked',c.h[2],c.h[3]],['November · forecast',c.b,c.f]].map(m=>`<div><span>${m[0]}</span><span class="m nw">${fmt(m[2])} of ${fmt(m[1])} <span class="${m[2]>m[1]?'pos':'neg'}">${pc((m[2]-m[1])/m[1]*100)}</span></span></div>`).join('')}</div></div>
    <div><h3>Reservations</h3>${c.res.length?`<div class="rows">${c.res.map(r=>`<div><span><b style="color:var(--t1)">${esc(r[0])}</b><small class="sub">${esc(r[2])}</small></span>${M(r[1])}</div>`).join('')}</div>`:'<span class="dim">Nothing is reserved against this budget.</span>'}</div></div></td></tr>`;
  const t=CCS.reduce((a,c)=>(a.b+=c.b,a.a+=c.a,a.r+=c.r,a.f+=c.f,a),{b:0,a:0,r:0,f:0});
  const foot=`<tfoot><tr><td class="ttl" data-l="">All cost centers</td><td class="n" data-l="Budget">${fmt(t.b)}</td><td class="n" data-l="Actual">${fmt(t.a)}</td><td class="n" data-l="Reserved">${fmt(t.r)}</td><td class="n" data-l="Available">${fmt(t.b-t.a-t.r)}</td><td class="n" data-l="Forecast">${fmt(t.f)}</td><td class="n wide" data-l="Variance"><span class="pos">${sg(t.f-t.b)} · ${pc((t.f-t.b)/t.b*100)}</span></td><td data-l="State">${pill('risk','At risk')}</td></tr></tfoot>`;
  return `<p class="lede">November 2026 by cost center. Actual is ${INVP}% invoiced, the rest estimated. All figures in USD.</p>
  ${card('Budget v3',tbl('bud',cols,CCS,{after:after,foot:foot}),copyBtn('bud'),'From Datarails, synced 2 Nov 2026. Two rows come from elsewhere: open a row to see.')}
  <p class="lede" style="margin-top:10px">Available is budget less actual and reservations. Variance is forecast against budget.</p>`;
};

SC.approvals=()=>{
  const cols=[
   {h:'Request',c:r=>`<a class="lnk" href="#request" data-a="req" data-v="${r.id}"><span class="nm">${esc(r.title)}</span></a><span class="sub">${esc(r.kind)}</span>`,v:r=>r.title},
   {h:'Amount',n:1,c:r=>`<b>${sg(r.amt)}</b> <span class="dim" style="font-family:Geist,sans-serif">${r.per}</span>`,v:r=>r.amt+' '+r.per},
   {h:'Cost center',c:r=>ccName(r.cc)},
   {h:'Budget left after',n:1,c:r=>`<span class="${r.ba[0][2]<0?'pos':''}">${fmt(r.ba[0][2])}</span>`},
   {h:'Asked by',k:'wide',c:r=>r.agent?`${esc(r.who)} <span class="bdg">agent</span><span class="sub">Sponsor ${esc(r.sponsor)}</span>`:esc(r.who)},
   {h:'Age',c:r=>r.age},
   {h:'Step',k:'wide',c:r=>r.status==='open'?pill(r.box==='me'?'risk':'nu',stepOf(r)):pill(r.status==='approved'?'ok':'over',r.decided)}];
  const sec=(t,rows,id,empty)=>`<h2 class="sec">${t} <span class="cnt" data-n="${rows.length}">${rows.length}</span></h2>`+(rows.length?`<section class="card">${tbl(id,cols,rows)}</section>`:`<div class="card empty">${empty}</div>`);
  const me=waiting(),mine=REQ.filter(r=>r.box==='mine'),done=REQ.filter(r=>r.status!=='open');
  tbl('inbox',cols,REQ);
  return `<div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap"><p class="lede" style="flex:1 1 240px">Spend that needs a person. Open a request to see its evidence before you decide. All figures in USD.</p>${copyBtn('inbox')}</div>
  ${sec('Waiting on you',me,'in1','Nothing is waiting on you.')}${sec('You raised',mine,'in2','You haven\'t raised anything.')}${sec('Decided',done,'in3','Nothing decided yet.')}
  <div class="card" style="margin-top:20px"><div class="ch"><h2>Who decides what<small>Per month, for infra and AI budget requests. A cost center that is at risk or over adds Finance.</small></h2><a class="btn sm" href="#rules">All policies</a></div><div class="cb"><div class="tiers" style="margin:0"><div><b>Automatic</b>under $500</div><div><b>Budget owner</b>to $5,000</div><div><b>Finance</b>to $25,000</div><div><b>CFO</b>above</div></div></div></div>`;
};

SC.request=()=>{
  const r=REQ.find(x=>x.id===S.req)||REQ[0],c=CC[r.cc],tier=r.amt<500?0:r.amt<=5000?1:r.amt<=25000?2:3,tot=r.lines.reduce((s,l)=>s+l[1],0);
  const SN={ok:ic('check'),no:ic('x')};
  let decide;
  if(r.status!=='open')decide=`<div class="msg ${r.status==='approved'?'ok':'no'}"><b>${esc(r.decided)}</b>${r.snap?`<br>A snapshot of the evidence above is saved with the decision.<br><span class="hash">record ${r.snap}</span>`:''}${r.status==='approved'&&r.done&&r.snap?`<br>${esc(r.done)}`:''}</div><a class="btn mt" href="#approvals" style="width:100%">Back to the inbox</a>`;
  else if(r.who===ME)decide=`<div class="msg">You raised this request, so you can't decide it. It's with <b>${esc(r.steps.find(s=>s.st==='now').who)}</b>.</div>`;
  else decide=`<div class="who"><span class="av">RS</span><div><b>Deciding as Rina Shapiro</b><small class="sub">Finance · controller</small></div></div>
    <label for="cmt" class="sub" style="margin-bottom:4px">Comment${S.err?'':' (needed to reject)'}</label>
    <textarea id="cmt" class="${S.err?'err':''}" placeholder="What the requester should know" aria-describedby="cmth"></textarea>
    ${S.err?'<p class="pos" style="font-size:12.5px;margin-top:4px" role="alert">Say why, so the requester knows what to change.</p>':''}
    <div class="acts"><button class="btn pri big" data-a="approve">Approve ${sg(r.amt).replace('+','')}</button><button class="btn big dng" data-a="reject">Reject</button></div>
    <p class="sub mt" id="cmth">Your decision saves a snapshot of the evidence shown here.</p>`;
  return `<a class="back" href="#approvals">${ic('left')}Approvals</a>
  <div class="rqh"><div style="flex:1 1 260px;min-width:0"><h2>${esc(r.title)}</h2><div class="meta">${r.status==='open'?pill(r.box==='me'?'risk':'nu',stepOf(r)):pill(r.status==='approved'?'ok':'over',stepOf(r))}${pill('nu',r.kind)}${pill('nu','Raised '+r.age+' ago')}</div></div>
   <div><div class="amt m">${sg(r.amt)} <small style="font-family:Geist,sans-serif;font-size:13px">${r.per} · USD</small></div><div style="margin-top:4px">${bdg('est')} <small>usage × rate card</small></div></div></div>
  <div class="grid g32">
   <div class="stack">
    ${card('What and why',`<div class="cb"><blockquote class="note">${esc(r.note)}</blockquote><dl class="kv">
      <dt>Asked by</dt><dd>${r.agent?`<b>${esc(r.who)}</b> <span class="bdg">agent</span><span class="sub">Sponsor: ${esc(r.sponsor)}, who answers for it. Agents can ask; only people decide.</span>`:`<b>${esc(r.who)}</b><span class="sub">${esc(r.role)}</span>`}</dd>
      <dt>Cost center</dt><dd>${ccName(r.cc)}<span class="sub">${esc(c.n)} · owner ${esc(c.o)}</span></dd>
      ${r.src.map(s=>`<dt>${esc(s[0])}</dt><dd>${esc(s[1])}</dd>`).join('')}</dl></div>`)}
    ${card('The evidence',`<div class="cb ev">
      <h3>Cost change</h3><div class="rows">${r.lines.map(l=>`<div><span>${esc(l[0])}</span>${M(l[1])}</div>`).join('')}<div class="tot"><span>${r.per==='a month'?'Each month':'Total'}</span><span class="m">${fmt(tot)}</span></div></div>
      <p class="sub" style="margin-top:6px">${esc(r.basis)}</p>
      <h3>Budget and forecast</h3>${r.ba.map(b=>`<div class="ba"><div><small>${esc(b[0])} · now</small><span class="m">${fmt(b[1])}</span></div><span class="dim" aria-hidden="true">→</span><div><small>with this request</small><span class="m ${b[2]<0?'pos':''}">${fmt(b[2])}</span></div></div>`).join('')}
      <div class="msg mt ${/over/.test(r.fnote)&&!/stays on track/.test(r.fnote)?'warn':''}">${esc(r.fnote)}</div>
      ${r.sim.length?`<h3>Similar past requests</h3><div class="rows">${r.sim.map(s=>`<div><span><b style="color:var(--t1);font-weight:500">${esc(s[0])}</b><small class="sub">${esc(s[2])}</small></span><span class="m nw">${esc(s[1])}</span></div>`).join('')}</div>`:''}
    </div>`)}
   </div>
   <div class="stack">
    ${card('The path',`<div class="cb"><div class="tiers">${[['Automatic','under $500'],['Budget owner','to $5,000'],['Finance','to $25,000'],['CFO','above']].map((t,i)=>`<div class="${i===tier?'on':''}"><b>${t[0]}</b>${t[1]}</div>`).join('')}</div>
      <p class="sub">${esc(r.why)}</p>
      <ol class="steps">${r.steps.map((s,i)=>`<li class="${s.st}"><span class="sn ${s.st}">${SN[s.st]||i+1}</span><div class="tx"><b>${esc(s.t)}</b>${s.st==='now'?' '+pill('risk','Now'):''}<small>${esc(s.who)}</small>${s.when?`<small>${esc(s.when)}</small>`:''}${s.cm?`<small style="color:var(--t2)">“${esc(s.cm)}”</small>`:''}</div></li>`).join('')}</ol></div>`)}
    ${card('Decide',`<div class="cb">${decide}</div>`)}
   </div>
  </div>`;
};

SC.contracts=()=>{
  const cols=[
   {h:'Vendor',c:x=>`<b>${esc(x.v)}</b><span class="sub">${esc(x.p)}</span>`,v:x=>x.v+' '+x.p},
   {h:'Cost center',c:x=>ccName(x.cc)},
   {h:'Annual value',n:1,c:x=>x.val?M(x.val):'<span class="dim">usage</span>',v:x=>x.val||''},
   {h:'Seats used of paid',k:'full',th:'Seats used of paid',c:x=>x.s?`<div class="barc"><div class="bar ${x.u>=x.s?'risk':''}"><i style="width:${x.u/x.s*100}%;border-radius:3px"></i></div><span style="min-width:52px">${x.u} / ${x.s}</span></div>`:'<span class="dim">No seats</span>',v:x=>x.s?x.u+' of '+x.s:''},
   {h:'Term',k:'wide',c:x=>`<span class="nw">${x.term}</span>`},
   {h:'Renews',c:x=>`<span class="nw">${x.ren}</span>`},
   {h:'Notice by',k:'wide',c:x=>x.d<=30?`<span class="nw">${x.not}</span> ${pill(x.d<=7?'over':'risk',x.d===1?'Tomorrow':'In '+x.d+' days')}`:`<span class="nw">${x.not}</span>`,v:x=>x.not}];
  const a=CON.filter(x=>x.d<=30),b=CON.filter(x=>x.d>30);
  tbl('con',cols,CON);
  return `<div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap"><p class="lede" style="flex:1 1 240px">Vendor contracts and subscriptions. Annual values are contracted, in USD.</p>${copyBtn('con')}</div>
  <h2 class="sec">Notice due in the next 30 days <span class="cnt" data-n="${a.length}">${a.length}</span></h2><section class="card">${tbl('con1',cols,a)}</section>
  <h2 class="sec">Later</h2><section class="card">${tbl('con2',cols,b)}</section>`;
};

SC.agents=()=>{
  const cost=AG.reduce((s,a)=>s+a.cost,0),inv=AG.reduce((s,a)=>s+a.inv,0),hrs=AG.reduce((s,a)=>s+a.hrs,0);
  const cols=[
   {h:'Agent',c:a=>`<b>${esc(a.n)}</b><span class="sub">${esc(a.o)} · <span class="code">${a.cc}</span></span>`,v:a=>a.n},
   {h:'Cost',n:1,c:a=>`<b>${fmt(a.cost)}</b>`},
   {h:'Models',n:1,c:a=>M(a.ai)},{h:'Compute',n:1,c:a=>M(a.cost-a.ai)},
   {h:'Runs',n:1,c:a=>a.runs.toLocaleString('en-US')},
   {h:'Outcomes',n:1,k:'wide',c:a=>`${a.out.toLocaleString('en-US')} <span class="dim" style="font-family:Geist,sans-serif">${a.unit}</span>`},
   {h:'Cost per outcome',n:1,k:'wide',c:a=>'$'+(a.cost/a.out).toFixed(2)},
   {h:'Capacity freed',n:1,k:'wide',c:a=>`${a.hrs} h <span class="dim">· ${fmt(a.hrs*RATE)}</span>`,v:a=>a.hrs+' h'},
   {h:'Suggestion',k:'full',c:a=>`${pill(SUG[a.sug][0],SUG[a.sug][1])}<span class="sub" style="margin-top:4px;max-width:260px">${esc(a.why)}</span>`,v:a=>SUG[a.sug][1]+': '+a.why}];
  return `<p class="lede">Each agent's November so far, 1 to 14 Nov. From Landflow's usage ledger and Clickland's Agent Value. All figures in USD.</p>
  <div class="stats">
   <div class="stat"><div class="k">Agent cost</div><div class="v m">${fmt(cost)}</div><div class="s">${Math.round(inv/cost*100)}% invoiced, the rest estimated</div></div>
   <div class="stat"><div class="k">Share of all spend</div><div class="v m">${(cost/TOT.amt*100).toFixed(1)}%</div><div class="s">of ${fmt(TOT.amt)} month to date</div></div>
   <div class="stat"><div class="k">Capacity freed</div><div class="v m">${hrs} h</div><div class="s">${fmt(hrs*RATE)} at $${RATE} an hour.<br>Capacity, not cash.</div></div>
   <div class="stat"><div class="k">Suggestions</div><div class="v" style="font-size:15px;white-space:normal;line-height:1.9">${pill('ok','1 scale')} ${pill('nu','2 keep')} ${pill('risk','1 review')} ${pill('over','1 retire')}</div><div class="s">An owner decides each one.</div></div>
  </div>
  ${card('Agents',tbl('ag',cols,AG),copyBtn('ag'))}
  <p class="lede" style="margin-top:10px">Capacity freed is hours saved × a blended role rate of $${RATE}. It shows time people got back; it isn't money saved.</p>`;
};

SC.close=()=>{
  const oct=S.close==='oct',acc=S.notes.filter(Boolean).length,est=TOT.amt-TOT.inv;
  const steps=oct?[
   ['ok','Usage ingested to the last day','Through 31 Oct · 68,912 usage records','Landledger ingest · 1 Nov 2026, 02:10'],
   ['ok','AI usage reconciled to invoices','0.8% gap, inside ±2% · Anthropic and OpenAI','Shira Mizrahi · 3 Nov 2026, 11:30'],
   ['ok','Unallocated spend under its limit','4% unallocated, limit 10%','Checked automatically · 3 Nov 2026, 11:31'],
   ['ok','Accrual proposal','$6,140 accrued for usage not yet invoiced','Rina Shapiro · 4 Nov 2026, 15:05'],
   ['ok','Variance notes','4 drafted by the Variance analyst agent, 4 accepted','Shira Mizrahi · 5 Nov 2026, 10:40'],
   ['ok','Upload to Datarails','$93,480 actual against $94,000 budget','Rina Shapiro · 5 Nov 2026, 17:20'],
   ['ok','Period locked','October can\'t change. Corrections post to November.','Avi Goldman · 5 Nov 2026, 18:00']
  ]:[
   ['ok','Usage ingested to the last day','Through 13 Nov · 31,204 usage records so far','Landledger ingest · 14 Nov 2026, 02:10'],
   ['ok','AI usage reconciled to invoices','1.4% gap, inside ±2% · invoices to 11 Nov','Shira Mizrahi · 13 Nov 2026, 15:40'],
   ['ok','Unallocated spend under its limit','6% unallocated, limit 10%','Checked automatically · 14 Nov 2026, 02:12'],
   ['wait','Accrual proposal',fmt(est)+' is estimated and not yet invoiced. The proposal is drawn up on 30 Nov.','Pending · Rina Shapiro'],
   [acc===3?'ok':'now','Variance notes','3 drafted by the Variance analyst agent, '+acc+' accepted',acc===3?'Rina Shapiro · '+S.noteT:'An analyst accepts each note. The agent only drafts.'],
   ['wait','Upload to Datarails','Not started. Opens when the notes and the accrual are done.',''],
   ['wait','Period locked','Not yet. The CFO locks November after the upload.','']];
  const done=steps.filter(s=>s[0]==='ok').length;
  return `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px"><div class="seg" role="group" aria-label="Period"><button data-a="cper" data-v="nov" data-fk="cp-nov" aria-pressed="${!oct}">November · open</button><button data-a="cper" data-v="oct" data-fk="cp-oct" aria-pressed="${oct}">October · locked</button></div>${pill(oct?'ok':'nu',done+' of 7 '+(oct?'done':'in order'))}</div>
  ${oct?`<div class="msg ok" style="margin-bottom:14px;display:flex;gap:10px;align-items:center">${ic('lock')}<span><b>October 2026 is locked.</b> Avi Goldman locked it on 5 Nov 2026. It can't change; corrections post to November.</span></div>`:''}
  ${card(oct?'October 2026 close':'November 2026 close',`<div class="cb"><ol class="steps" style="margin-top:4px">${steps.map((s,i)=>`<li class="${s[0]}"><span class="sn ${s[0]}">${s[0]==='ok'?ic('check'):i+1}</span><div class="tx"><b>${esc(s[1])}</b>${s[0]==='now'?' '+pill('risk','Needs you'):''}<small style="color:var(--t2)">${esc(s[2])}</small>${s[3]?`<small>${esc(s[3])}</small>`:''}${!oct&&i===4?`<div class="rows" style="margin-top:8px">${NOTES.map((n,j)=>`<div style="align-items:flex-start"><span><span class="code" style="color:var(--t1)">${n[0]}</span><small class="sub" style="color:var(--t2)">${esc(n[1])}</small></span>${S.notes[j]?pill('ok','Accepted'):`<button class="btn sm" data-a="note" data-v="${j}" data-fk="n-${j}">Accept</button>`}</div>`).join('')}</div>`:''}${!oct&&i===6?`<button class="btn sm mt" disabled>${ic('lock')}Lock November</button>`:''}</div></li>`).join('')}</ol></div>`,'','The steps run in order. Each shows who did it and when.')}`;
};

SC.rules=()=>{
  const rc=[{h:'Rate',c:r=>`${esc(r[0])}<span class="sub">per ${r[1]}</span>`,v:r=>r[0]+' (per '+r[1]+')'},{h:'Price',n:1,c:r=>'$'+(r[2]<.01?r[2].toFixed(4):r[2]<1?r[2].toFixed(3).replace(/0$/,''):r[2].toFixed(2))},{h:'vs v2',n:1,c:r=>r[3]==='same'?'<span class="dim">same</span>':r[3]}];
  const al=[{h:'Selector',c:r=>`<span class="dim m">${RULES.indexOf(r)+1}</span>&nbsp; <span class="code">${esc(r[0])}</span>`,v:r=>r[0]},{h:'Cost center',c:r=>ccName(r[1])},{h:'Team',c:r=>esc(r[2])},{h:'Product',c:r=>esc(r[3])},{h:'P&L class',c:r=>esc(r[4])},{h:'Capitalisable',c:r=>r[5]?pill('ok','Yes'):'<span class="dim">No</span>',v:r=>r[5]?'Yes':'No'}];
  const po=[{h:'Request kind',c:r=>`<b>${r[0]}</b>`},{h:'Automatic',c:r=>r[1]},{h:'Budget owner',k:'wide',c:r=>r[2]},{h:'Finance',k:'wide',c:r=>r[3]},{h:'CFO',k:'wide',c:r=>r[4]}];
  return `<p class="lede">How usage becomes cost, where it lands, and who decides. Prices in USD.</p>
  <div class="grid g32">
   ${card('Rate card v3',tbl('rc',rc,RATES,{cards:false})+`<div class="cb" style="border-top:1px solid var(--hair)"><div class="rows"><div><span>v2</span><span class="dim">1 Jul – 30 Sep 2026</span></div><div><span>v1</span><span class="dim">1 Jan – 30 Jun 2026</span></div></div><div class="msg mt">A change is a request. <a href="#request" data-a="req" data-v="r4"><b>Rate card v4: GPU hour</b></a> is waiting on Finance.</div></div>`,copyBtn('rc'),'In effect since 1 Oct 2026')}
   <div class="stack">
    ${card('Shared costs',`<div class="cb"><p class="t2">Whatever no rule matches lands in <b>Shared pool</b>: cluster idle, ingress, monitoring and backups. It stays its own row and is never folded into a team.</p><div class="rows mt"><div><span>Split basis</span><span>Share of vCPU-hours</span></div><div><span>Shown as</span><span>Showback only</span></div><div><span>Unallocated now</span><span class="m">6% · limit 10%</span></div></div></div>`)}
    ${card('Not a general ledger',`<div class="cb"><p class="t2">Landledger is a cost subledger for management reporting. Nothing here posts journals. Month-end figures go to Datarails.</p></div>`)}
   </div>
  </div>
  <div class="stack" style="margin-top:14px">
   ${card('Allocation rules',tbl('al',al,RULES),copyBtn('al'),'Checked in order. The first match wins.')}
   ${card('Policies',tbl('po',po,POL),copyBtn('po'),'Who decides each kind of request. A cost center that is at risk or over adds Finance.')}
  </div>`;
};

SC.audit=()=>{
  const cols=[{h:'What',c:e=>`<b style="font-weight:500">${esc(e.what)}</b>`},{h:'Who',k:'wide',c:e=>`${esc(e.who)} <span class="dim">· ${esc(e.role)}</span>`},{h:'Kind',c:e=>pill('nu',e.kind)},{h:'When',k:'wide',c:e=>`<span class="nw">${e.when}</span>`},{h:'Hash',k:'wide',c:e=>`<span class="hash">${e.h}</span>`,v:e=>e.h},{h:'Chain',n:1,k:'wide',c:e=>`#${e.n.toLocaleString('en-US')} <span class="dim">← ${e.prev.slice(0,6)}</span>`,v:e=>e.n}];
  const v=S.verify;
  return `<p class="lede">Every decision, rule, rate and period change, newest first. Auditors see this screen, Explore and Budgets, read-only.</p>
  <div class="msg ${v===2?'ok':''}" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px" aria-live="polite"><span>${v===2?`<b>Chain intact.</b> ${chainN.toLocaleString('en-US')} records, each one's hash matches the next. Checked just now.`:v===1?'Checking each record against the one before it…':`<b>${chainN.toLocaleString('en-US')} records.</b> Each carries the hash of the one before, so a changed record breaks the chain.`}</span><button class="btn sm" data-a="verify" data-fk="verify" ${v===1?'disabled':''}>${ic('audit')}Verify chain</button></div>
  ${card('Records',tbl('au',cols,AUD),copyBtn('au'),'The latest '+AUD.length+' of '+chainN.toLocaleString('en-US'))}`;
};

/* ---------- charts ---------- */
const DRAW={
 burn(el){
  const W=el.clientWidth,H=W<520?230:270,l=44,r=10,t=14,b=24,pw=W-l-r,ph=H-t-b,ym=120000;
  const x=d=>l+(d-1)/29*pw,y=v=>t+ph-v/ym*ph;
  let c=0;const pts=DAILY.map((v,i)=>[i+1,c+=v]);
  const line=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join('');
  const p9=pts[8],ax=x(9),ay=y(p9[1]),sm=W<520;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cumulative cost in November: $48,210 by 14 Nov, forecast $101,400 by 30 Nov against a budget of $96,000.">
  ${[0,25000,50000,75000,100000].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">$${v/1000}k</text>`).join('')}
  ${[1,7,14,21,30].map(d=>`<text x="${x(d)}" y="${H-6}" text-anchor="${d===30?'end':d===1?'start':'middle'}">${d} Nov</text>`).join('')}
  <line x1="${l}" x2="${W-r}" y1="${y(BUD)}" y2="${y(BUD)}" stroke="var(--t3)" stroke-width="1.5"/>
  <text x="${l+4}" y="${y(BUD)-6}" class="v">Budget $96,000</text>
  <line x1="${x(14)}" x2="${x(14)}" y1="${y(BUD)+6}" y2="${t+ph}" stroke="var(--bd)" stroke-dasharray="2 3"/>
  <path d="M${x(14)} ${y(TOT.amt)}L${x(30)} ${y(FHI)}L${x(30)} ${y(FLO)}Z" fill="var(--viz-1)" opacity=".2"/>
  <line x1="${x(14)}" y1="${y(TOT.amt)}" x2="${x(30)}" y2="${y(FC)}" stroke="var(--viz-1)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="${line}" fill="none" stroke="var(--viz-1)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${x(14)}" cy="${y(TOT.amt)}" r="4" fill="var(--viz-1)" stroke="var(--sf)" stroke-width="2"/>
  <text x="${x(14)+9}" y="${y(TOT.amt)+16}" class="v">$48,210 today</text>
  <circle cx="${x(30)}" cy="${y(FC)}" r="3.5" fill="var(--sf)" stroke="var(--viz-1)" stroke-width="2"/>
  <text x="${W-r}" y="${y(FHI)-(sm?20:8)}" text-anchor="end" class="v">Forecast $101,400</text>
  <line x1="${ax}" y1="${ay-7}" x2="${ax}" y2="${ay-48}" stroke="var(--t1)"/>
  <circle cx="${ax}" cy="${ay}" r="4.5" fill="var(--sf)" stroke="var(--t1)" stroke-width="1.75"/>
  <text x="${ax-(sm?70:6)}" y="${ay-54}" class="a">9 Nov · agent loop, $1,240</text>
  </svg>`;
 },
 stack(el){
  const S_=CH.stack,W=el.clientWidth,H=200,l=44,r=4,t=8,b=22,pw=W-l-r,ph=H-t-b,n=DAILY.length;
  const tot=DAILY.map((_,i)=>S_.reduce((s,x)=>s+x.v[i],0)),mx=Math.max.apply(0,tot)||1;
  const p=Math.pow(10,Math.floor(Math.log10(mx))),f=mx/p,ym=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const k=v=>v>=1000?'$'+(v/1000)+'k':'$'+v,bw=Math.min(30,pw/n*.64),y=v=>t+ph-v/ym*ph;
  let h=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Daily cost, 1 to 14 Nov, stacked by group.">`;
  [0,ym/2,ym].forEach(v=>h+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`);
  for(let i=0;i<n;i++){const cx=l+(i+.5)*pw/n;let acc=0;
   S_.forEach(x=>{const y1=y(acc+x.v[i]),hh=y(acc)-y1;acc+=x.v[i];if(hh>.6)h+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh-1,.5).toFixed(1)}" rx="1.5" fill="${x.c}" opacity="${x.o||1}"><title>${i+1} Nov · ${esc(x.n)}: ${fmt(x.v[i])}</title></rect>`;});
   if(W>520||i%2===0)h+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${i+1}</text>`;}
  el.innerHTML=h+'</svg>';
 }
};
function draw(){document.querySelectorAll('[data-chart]').forEach(el=>DRAW[el.dataset.chart](el));}

/* ---------- shell ---------- */
let cur='';
function shell(){
  const n=waiting().length,link=(x,ph)=>`<a href="#${x[0]}"${(cur===x[0]||(cur==='request'&&x[0]==='approvals'))?' aria-current="page"':''}${ph?' data-a="closeMore"':''}>${ic(x[0])}<span>${x[1]}</span>${x[0]==='approvals'?`<span class="cnt" data-n="${n}" aria-label="${n} waiting">${n}</span>`:''}</a>`;
  $('#nav').innerHTML=NAV.map(g=>`<h2>${g[0]}</h2>${g[1].map(x=>link(x)).join('')}`).join('');
  const all=NAV.reduce((a,g)=>a.concat(g[1]),[]),bar=all.filter(x=>x[2]),more=all.filter(x=>!x[2]);
  $('#tabs').innerHTML=bar.map(x=>link(x)).join('')+`<button data-a="more" aria-haspopup="dialog"${more.some(x=>x[0]===cur)?' aria-current="page"':''}>${ic('more')}<span>More</span></button>`;
  $('#sheet').innerHTML=`<div class="grip"></div>`+NAV.map(g=>{const xs=g[1].filter(x=>!x[2]);return xs.length?`<h2>${g[0]}</h2>${xs.map(x=>link(x,1)).join('')}`:'';}).join('')+`<div class="row"><div class="user" style="border:0;margin:0;padding:0"><span class="av">RS</span><div><b>Rina Shapiro</b><small>Finance · controller</small></div></div><div class="seg" role="group" aria-label="Theme" data-themeseg></div></div>`;
  document.querySelectorAll('[data-themeseg]').forEach(el=>el.innerHTML=[['sys','System'],['light','Light'],['dark','Dark']].map(t=>`<button data-a="theme" data-v="${t[0]}" aria-pressed="${S.theme===t[0]}" aria-label="${t[1]} theme" title="${t[1]}">${ic(t[0]==='light'?'sun':t[0]==='dark'?'moon':'sys')}</button>`).join(''));
  $('#perbtn').innerHTML=`${ic('cal')}<span>Nov 2026 <span class="st">· open</span></span>${ic('down')}`;
}
function render(keep){
  let r=location.hash.slice(1);if(!SC[r])r='overview';
  const fk=keep&&document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.fk:null;
  const changed=r!==cur;cur=r;
  if(changed){S.err=false;}
  document.title=TITLE[r]+' · Landledger';$('#ttl').textContent=TITLE[r];
  $('#view').innerHTML=SC[r]();shell();draw();
  if(changed&&!keep)window.scrollTo(0,0);
  if(fk){const el=document.querySelector('[data-fk="'+(window.CSS&&CSS.escape?CSS.escape(fk):fk)+'"]');if(el)el.focus({preventScroll:true});}
}
function more(open){const w=$('#sheetw');w.hidden=!open;if(open){const a=$('#sheet a');a&&a.focus();}else{const b=$('#tabs button');b&&b.focus({preventScroll:true});}}
function pop(open){$('#pop').hidden=!open;$('#perbtn').setAttribute('aria-expanded',open);}
function decide(ok){
  const r=REQ.find(x=>x.id===S.req),cm=($('#cmt')||{}).value||'';
  if(!r||r.status!=='open'||r.who===ME)return;
  if(!ok&&!cm.trim()){S.err=true;render(true);const c=$('#cmt');c&&c.focus();return;}
  const t=nowT(),i=r.steps.findIndex(s=>s.st==='now');
  Object.assign(r.steps[i],{st:ok?'ok':'no',who:ME,when:(ok?'Approved ':'Rejected ')+t,cm:cm.trim()});
  r.steps.slice(i+1).forEach(s=>{if(ok&&s.auto){s.st='ok';s.when='Done '+t;}else if(!ok){s.who='Not applied';}});
  r.status=ok?'approved':'rejected';r.box='done';r.decided=(ok?'Approved':'Rejected')+' 14 Nov by '+ME;
  const e=seal({when:t,who:ME,role:'Finance',kind:'Decision',what:(ok?'Approved':'Rejected')+' "'+r.title+'" · '+fmt(r.amt)+' '+r.per+' · evidence snapshot saved'});
  AUD.unshift(e);r.snap=e.h;S.err=false;S.verify=0;
  const c=CC[r.cc];if(c&&c.res)c.res.forEach(x=>{if(x[0]===r.title)x[2]=ok?'Approved 14 Nov by '+ME:'Released · rejected 14 Nov';});
  render(true);
  const n=waiting().length;
  toast((ok?'Approved. ':'Rejected. ')+(r.agent?r.sponsor:r.who)+' has been told. '+(n?n+' still waiting on you.':'Nothing else is waiting on you.'));
}
const ACT={
  copy(v){const txt=COPY[v]||'',ok=()=>toast('Copied '+(txt.split('\n').length-1)+' rows. Paste into Excel.'),no=()=>toast('The clipboard is blocked here. Select the table and copy it.');
    const old=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const done=document.execCommand('copy');ta.remove();done?ok():no();}catch(e){no();}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,old);else old();}catch(e){old();}},
  by(v){S.ex.by=v;S.ex.f=S.ex.f.filter(f=>f.d!==v);render(true);},
  cat(v){S.ex.cat=v;render(true);},
  drill(v){const s=S.ex;s.f.push({d:s.by,v:v});s.by=NEXT[s.by];render(true);},
  rmf(v){const s=S.ex,n=+v;if(s.f[n])s.by=s.f[n].d;s.f=s.f.slice(0,n);render(true);},
  rmf1(v){S.ex.f.splice(+v,1);render(true);},
  req(v){S.req=v;S.err=false;},
  approve(){decide(true);},reject(){decide(false);},
  theme(v){S.theme=v;if(v==='sys')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);shell();},
  more(){more(true);},
  closeMore(v,t,e){if(t.id==='sheetw'&&e.target!==t)return;more(false);},
  per(){pop($('#pop').hidden);},
  setper(v){pop(false);if(v==='oct'){S.close='oct';if(cur==='close')render(true);else location.hash='#close';}else if(cur==='close'){S.close='nov';render(true);}},
  cc(v){S.cc=S.cc===v?null:v;render(true);},
  cper(v){S.close=v;render(true);},
  note(v){S.notes[+v]=1;if(S.notes.every(Boolean)){S.noteT=nowT();AUD.unshift(seal({when:S.noteT,who:ME,role:'Finance',kind:'Period',what:'Accepted 3 variance notes for November 2026'}));S.verify=0;toast('All 3 notes accepted. The accrual proposal is next.');}render(true);},
  verify(){S.verify=1;render(true);setTimeout(()=>{let ok=true;for(let i=AUD.length-1;i>=0;i--){const e=AUD[i];if(hash(e.prev+e.when+e.who+e.what)!==e.h||(i<AUD.length-1&&e.prev!==AUD[i+1].h))ok=false;}S.verify=ok?2:0;if(cur==='audit')render(true);toast(ok?'Chain intact.':'The chain is broken.');},700);},
  toast(v){toast(v);}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!e.target.closest('.per'))pop(false);
  if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset.v,t,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#sheetw').hidden)more(false);if(!$('#pop').hidden){pop(false);$('#perbtn').focus();}}});
window.addEventListener('hashchange',()=>{more.call&&($('#sheetw').hidden=true);render();});
let rz,lw=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.innerWidth!==lw){lw=window.innerWidth;draw();}},120);});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
