# Landledger's local infrastructure (compose project `landledger-infra`, OrbStack only):
#   pnpm dev:up   # COMPOSE_BAKE=false docker --context orbstack compose -p landledger-infra -f deploy/compose.infra.yml up -d --wait
# Development credentials only; the defaults match .env.example. Two roles: `landledger` owns the schema and runs the
# migrations (`pnpm db:migrate`); the API connects as `landledger_app`, which may insert and read the ledger but never
# change it (migration 0008). postgres-init/ creates the app role on a fresh volume; db:migrate sets its password.
name: landledger-infra

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: landledger
      POSTGRES_PASSWORD: ${LANDLEDGER_PG_PASSWORD:-landledger-dev}
      POSTGRES_DB: landledger
      LANDLEDGER_APP_PG_PASSWORD: ${LANDLEDGER_APP_PG_PASSWORD:-landledger-app-dev}
    ports:
      - '127.0.0.1:25532:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'landledger']
      interval: 3s
      retries: 40

volumes:
  postgres-data:
